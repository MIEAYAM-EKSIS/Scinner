
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3d;
--accent:#7c6fff;--accent2:#ff6b9d;--accent3:#00d4aa;
--text:#f0f0ff;--muted:#7a7a9a;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
.app{max-width:900px;margin:0 auto;padding:24px 16px}

/* Header */
.header{text-align:center;margin-bottom:36px;position:relative}
.logo{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#7c6fff,#ff6b9d,#00d4aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.tagline{color:var(--muted);font-size:14px;letter-spacing:0.05em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent3);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}

/* Subject pills */
.subjects{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.pill:hover,.pill.active{border-color:var(--accent);color:var(--accent);background:rgba(124,111,255,0.1)}
.pill.active{font-weight:500}

/* Scanner area */
.scanner-wrap{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--border);margin-bottom:20px}
.scanner-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.scanner-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}
.status-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent3)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite}

.video-container{position:relative;background:#050508;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
#videoEl{width:100%;height:100%;object-fit:cover;display:none}
.placeholder-screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:background 0.3s}
.placeholder-screen:hover{background:rgba(124,111,255,0.05)}
.scan-icon{width:80px;height:80px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;position:relative}
.scan-icon svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:1.5}
.scan-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.5s infinite}
@keyframes ring{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.4);opacity:0}}
.placeholder-text{color:var(--muted);font-size:14px;text-align:center}
.placeholder-text strong{color:var(--text);display:block;font-size:16px;margin-bottom:4px}

/* Scan frame overlay */
.scan-frame{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
.corner{position:absolute;width:24px;height:24px;border-color:var(--accent);border-style:solid}
.corner-tl{top:16px;left:16px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.corner-tr{top:16px;right:16px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.corner-bl{bottom:16px;left:16px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.corner-br{bottom:16px;right:16px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:16px;right:16px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);top:20%;animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%{top:20%}50%{top:75%}100%{top:20%}}

/* Controls */
.controls{display:flex;gap:12px;padding:16px 20px}
#btnStart{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#9b8dff);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;letter-spacing:0.03em}
#btnStart:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,111,255,0.4)}
#btnCapture{flex:1;padding:12px;border-radius:12px;border:2px solid var(--accent3);background:transparent;color:var(--accent3);font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;display:none}
#btnCapture:hover{background:rgba(0,212,170,0.1)}
#btnUpload{padding:12px 20px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:13px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
#btnUpload:hover{border-color:var(--accent2);color:var(--accent2)}
#fileInput{display:none}

/* Canvas hidden */
#captureCanvas{display:none}

/* Answer section */
.answer-section{display:none;animation:fadeUp 0.4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.answer-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.answer-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.answer-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.ai-badge{background:linear-gradient(135deg,rgba(124,111,255,0.2),rgba(255,107,157,0.2));border:1px solid rgba(124,111,255,0.3);color:var(--accent);font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;letter-spacing:0.05em}
.subject-tag{font-size:12px;color:var(--muted);font-weight:400}

/* Preview image */
.preview-wrap{padding:16px 20px;border-bottom:1px solid var(--border)}
#previewImg{max-height:200px;width:auto;max-width:100%;border-radius:10px;display:block}

.answer-body{padding:20px}
#answerText{font-size:15px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.typing-cursor{display:inline-block;width:2px;height:16px;background:var(--accent);animation:blink 1s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.answer-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.action-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}
#btnNew{padding:8px 20px;border-radius:10px;border:none;background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;margin-left:auto;font-family:'DM Sans',sans-serif;transition:all 0.2s}
#btnNew:hover{background:var(--border)}

/* Loading */
.loading-wrap{padding:32px 20px;text-align:center;display:none}
.loading-orb{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--muted);font-size:14px}
.loading-sub{color:var(--muted);font-size:12px;margin-top:6px;opacity:0.6}

/* Error */
.error-msg{background:rgba(255,100,100,0.1);border:1px solid rgba(255,100,100,0.3);color:#ff9090;padding:12px 16px;border-radius:10px;font-size:14px;margin:12px 20px;display:none}

/* Extra question input */
.extra-input-wrap{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
#extraQ{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.2s}
#extraQ:focus{border-color:var(--accent)}
#btnAsk{padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s;white-space:nowrap}
#btnAsk:hover{background:#9b8dff}

/* History dots */
.history-row{display:flex;gap:6px;justify-content:center;margin-top:20px}
.h-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all 0.2s}
.h-dot.active{background:var(--accent);transform:scale(1.3)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">SnapSolve AI</div>
    <div class="tagline"><span class="dot"></span>Scan soal, dapat jawaban instan</div>
  </div>

  <div class="subjects" id="subjectPills">
    <div class="pill active" data-sub="auto">🤖 Auto Detect</div>
    <div class="pill" data-sub="Matematika">➕ Matematika</div>
    <div class="pill" data-sub="Fisika">⚡ Fisika</div>
    <div class="pill" data-sub="Kimia">🧪 Kimia</div>
    <div class="pill" data-sub="Biologi">🧬 Biologi</div>
    <div class="pill" data-sub="Bahasa Inggris">🌍 B. Inggris</div>
    <div class="pill" data-sub="Sejarah">📜 Sejarah</div>
    <div class="pill" data-sub="Geografi">🗺️ Geografi</div>
  </div>

  <div class="scanner-wrap">
    <div class="scanner-header">
      <span class="scanner-label">Kamera Scanner</span>
      <span class="status-badge" id="statusBadge"><span class="status-dot"></span>Siap</span>
    </div>

    <div class="video-container" id="videoContainer">
      <video id="videoEl" playsinline autoplay muted></video>
      <canvas id="captureCanvas"></canvas>
      <div class="scan-frame" id="scanFrame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="placeholder-screen" id="placeholderScreen" onclick="startCamera()">
        <div class="scan-icon">
          <svg viewBox="0 0 24 24"><path d="M2 8V6a2 2 0 0 1 2-2h2"/><path d="M2 16v2a2 2 0 0 0 2 2h2"/><path d="M22 8V6a2 2 0 0 0-2-2h-2"/><path d="M22 16v2a2 2 0 0 1-2 2h-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
          <div class="scan-ring"></div>
        </div>
        <div class="placeholder-text"><strong>Ketuk untuk aktifkan kamera</strong>Arahkan ke soal yang ingin dipecahkan</div>
      </div>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <div class="controls">
      <button id="btnStart" onclick="startCamera()">📷 Aktifkan Kamera</button>
      <button id="btnCapture" onclick="captureAndSolve()">⚡ Scan & Jawab</button>
      <button id="btnUpload" onclick="document.getElementById('fileInput').click()">📁 Upload</button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
    </div>
  </div>

  <!-- Loading -->
  <div class="answer-section" id="loadingSection">
    <div class="answer-card">
      <div class="loading-wrap" id="loadingWrap">
        <div class="loading-orb"></div>
        <div class="loading-text">Menganalisis soal...</div>
        <div class="loading-sub" id="loadingSub">AI sedang membaca pertanyaan</div>
      </div>
    </div>
  </div>

  <!-- Answer -->
  <div class="answer-section" id="answerSection">
    <div class="answer-card">
      <div class="answer-header">
        <div class="answer-title">
          <span class="ai-badge">AI ANSWER</span>
          <span id="detectedSubject" class="subject-tag"></span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="action-btn" onclick="copyAnswer()">📋 Copy</button>
          <button id="btnNew" onclick="resetAll()">Soal Baru →</button>
        </div>
      </div>
      <div class="preview-wrap" id="previewWrap" style="display:none">
        <img id="previewImg" alt="Foto soal">
      </div>
      <div class="answer-body">
        <div id="answerText"></div>
      </div>
      <div class="extra-input-wrap">
        <input id="extraQ" type="text" placeholder="Ada yang mau ditanyakan lebih lanjut?">
        <button id="btnAsk" onclick="askFollowUp()">Tanya ↗</button>
      </div>
    </div>
  </div>

  <div class="history-row" id="historyRow"></div>
</div>

<script>
let stream=null,selectedSubject='auto',capturedImage=null,conversationHistory=[],solveCount=0;

// Subject pills
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    selectedSubject=p.dataset.sub;
  });
});

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    const v=document.getElementById('videoEl');
    v.srcObject=stream;
    v.style.display='block';
    document.getElementById('placeholderScreen').style.display='none';
    document.getElementById('scanFrame').style.display='block';
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnCapture').style.display='flex';
    document.getElementById('statusBadge').innerHTML='<span class="status-dot"></span>Kamera Aktif';
    setErr('');
  }catch(e){
    setErr('Tidak bisa akses kamera. Coba upload gambar.');
  }
}

function captureAndSolve(){
  const v=document.getElementById('videoEl');
  const c=document.getElementById('captureCanvas');
  c.width=v.videoWidth||640;
  c.height=v.videoHeight||360;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  const dataUrl=c.toDataURL('image/jpeg',0.85);
  capturedImage=dataUrl;
  showPreview(dataUrl);
  solveWithAI(dataUrl);
}

function handleFileUpload(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    capturedImage=ev.target.result;
    showPreview(ev.target.result);
    solveWithAI(ev.target.result);
  };
  reader.readAsDataURL(file);
}

function showPreview(dataUrl){
  const img=document.getElementById('previewImg');
  img.src=dataUrl;
  document.getElementById('previewWrap').style.display='block';
}

async function solveWithAI(imageData){
  showLoading(true);
  setErr('');
  const sub=selectedSubject==='auto'?'(deteksi otomatis)':selectedSubject;
  const sysPrompt=`Kamu adalah tutor AI yang pintar dan membantu. Saat menerima gambar soal atau pertanyaan, kamu akan:
1. Identifikasi mata pelajaran (Matematika, Fisika, Kimia, Biologi, Bahasa Inggris, dll)
2. Baca soal dengan teliti
3. Berikan jawaban lengkap, jelas, dan terstruktur dalam Bahasa Indonesia
4. Tampilkan langkah-langkah penyelesaian jika ada
5. Berikan penjelasan singkat mengapa jawabannya benar
Format: Mulai dengan "📚 Mata Pelajaran: [nama]" lalu baris baru, kemudian jawaban lengkap. Gunakan emoji secukupnya agar menarik.
Mata pelajaran yang diminta: ${sub}`;

  const b64=imageData.split(',')[1];
  const mime=imageData.match(/data:(.*?);/)[1];

  const msgs=[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:'Tolong selesaikan soal dalam gambar ini dan berikan jawaban lengkap beserta langkah-langkahnya.'}]}];

  conversationHistory=[{role:'user',content:'[Gambar soal dikirim]'}];

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sysPrompt,messages:msgs})
    });
    const data=await resp.json();
    if(data.error){setErr('Error: '+data.error.message);showLoading(false);return;}
    const answer=data.content.filter(x=>x.type==='text').map(x=>x.text).join('');
    conversationHistory.push({role:'assistant',content:answer});
    showAnswer(answer);
    solveCount++;
    addHistoryDot();
  }catch(e){
    setErr('Gagal konek ke AI. Coba lagi.');
    showLoading(false);
  }
}

async function askFollowUp(){
  const q=document.getElementById('extraQ').value.trim();
  if(!q)return;
  conversationHistory.push({role:'user',content:q});
  document.getElementById('extraQ').value='';
  showLoading(true);
  document.getElementById('answerSection').style.display='none';

  const msgs=conversationHistory.map(m=>({role:m.role,content:m.content}));
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'Kamu adalah tutor AI yang membantu. Jawab pertanyaan lanjutan tentang soal yang sudah dibahas. Gunakan Bahasa Indonesia.',messages:msgs})
    });
    const data=await resp.json();
    const ans=data.content.filter(x=>x.type==='text').map(x=>x.text).join('');
    conversationHistory.push({role:'assistant',content:ans});
    showAnswer(ans);
  }catch(e){
    setErr('Gagal. Coba lagi.');
    showLoading(false);
  }
}

function showLoading(show){
  const ls=document.getElementById('loadingSection');
  const lw=document.getElementById('loadingWrap');
  if(show){
    ls.style.display='block';
    lw.style.display='block';
    document.getElementById('answerSection').style.display='none';
    const msgs=['AI sedang membaca pertanyaan...','Menganalisis isi soal...','Menyusun jawaban terbaik...','Hampir selesai...'];
    let i=0;
    window._loadInt=setInterval(()=>{document.getElementById('loadingSub').textContent=msgs[i++%msgs.length];},1200);
  }else{
    clearInterval(window._loadInt);
    ls.style.display='none';
    lw.style.display='none';
  }
}

function showAnswer(text){
  showLoading(false);
  const subMatch=text.match(/Mata Pelajaran:\s*([^\n]+)/i);
  if(subMatch)document.getElementById('detectedSubject').textContent=subMatch[1].trim();
  const sec=document.getElementById('answerSection');
  sec.style.display='block';
  const el=document.getElementById('answerText');
  el.innerHTML='';
  let i=0;
  const clean=text.replace(/```/g,'').trim();
  const cursor=document.createElement('span');
  cursor.className='typing-cursor';
  el.appendChild(cursor);
  const interval=setInterval(()=>{
    if(i<clean.length){
      el.insertBefore(document.createTextNode(clean[i]),cursor);
      i++;
    }else{
      clearInterval(interval);
      cursor.remove();
    }
  },12);
}

function copyAnswer(){
  const t=document.getElementById('answerText').textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const btn=event.target;
    const orig=btn.textContent;
    btn.textContent='✅ Copied!';
    setTimeout(()=>btn.textContent=orig,2000);
  });
}

function resetAll(){
  capturedImage=null;
  conversationHistory=[];
  document.getElementById('answerSection').style.display='none';
  document.getElementById('loadingSection').style.display='none';
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('answerText').innerHTML='';
  document.getElementById('detectedSubject').textContent='';
  document.getElementById('fileInput').value='';
  setErr('');
}

function addHistoryDot(){
  const row=document.getElementById('historyRow');
  document.querySelectorAll('.h-dot').forEach(d=>d.classList.remove('active'));
  const d=document.createElement('div');
  d.className='h-dot active';
  d.title='Soal #'+solveCount;
  row.appendChild(d);
}

function setErr(msg){
  const e=document.getElementById('errMsg');
  e.textContent=msg;
  e.style.display=msg?'block':'none';
}
</script>
</body>
</html>
